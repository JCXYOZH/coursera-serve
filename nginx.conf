    } # server end

    # ========================================
    # Server Block 2: Port 443 (HTTPS)
    # Domain: do.offer.us.ci
    # Backend: 8170 (纯代理，无静态文件)
    # SSL Certificate
    # ========================================
    server {
        listen 443 ssl http2;
        server_name do.offer.us.ci;

        # SSL 证书配置
        ssl_certificate /root/do.offer.us.ci.cer;
        ssl_certificate_key /root/do.offer.us.ci.key;

        # SSL 协议和加密套件（推荐配置）
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # SSL 会话缓存
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # OCSP Stapling（可选，提升性能）
        ssl_stapling on;
        ssl_stapling_verify on;
        ssl_trusted_certificate /root/fullchain.cer;  # 如果有 CA 链证书

        # 安全头部
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # 访问日志和错误日志
        # access_log /var/log/nginx/xzs_443_access.log main;
        # error_log  /var/log/nginx/xzs_443_error.log warn;

        # 代理所有请求到后端 8170（无静态文件服务）
        location / {
            proxy_pass http://127.0.0.1:8170;
            proxy_http_version 1.1;

            # 代理头部
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket 支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 超时配置
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            send_timeout 60s;

            # 缓冲配置
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 32k;
            proxy_busy_buffers_size 64k;}

        # 错误页面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/local/nginx/html;
            internal;
        }
    } # server end

    # 可选：如果以后启用 HTTPS，请添加 443 server 块并把 80 重定向到 443

    # include additional confs
    # include conf.d/*.conf;
    # include sites-enabled/*;
}