user root;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /usr/local/nginx/logs/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$request_time" "$upstream_response_time" '
                  '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    client_max_body_size 200m;
    client_body_buffer_size 128k;

    open_file_cache max=20000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 代理默认头
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffer_size 16k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;
    proxy_temp_file_write_size 64k;

    # ---------------------------
    # upstream 定义（gateway 为统一入口）
    upstream gateway_backend {
        server localhost:8500;
        # 未来需要负载均衡或备份可在此添加更多 server
    }

    # 下面列出各服务端口，备用（当前所有接口统一走 gateway）
    upstream edu_backend   { server 127.0.0.1:8010; }   # edu8010
    upstream oss_backend   { server 127.0.0.1:8120; }   # oss8120
    upstream vod_backend   { server 127.0.0.1:8150; }   # vod8150
    upstream cms_backend   { server 127.0.0.1:8100; }   # cms8100
    upstream ucenter_backend { server 127.0.0.1:8160; } # ucenter8160
    upstream sms_backend   { server 127.0.0.1:8130; }   # sms8130
    upstream order_backend { server 127.0.0.1:8110; }   # order8110
    upstream statistics_backend { server 127.0.0.1:8140; } # statistics8140
    upstream auth_backend  { server 127.0.0.1:8000; }   # auth8000
    # ---------------------------

    server {
        listen       3001;
        server_name  localhost;   # 替换为实际 IP 或域名；可用 "_" 或实际 IP
        # root 指向你放置前端构建文件的目录（你说 html/OESStudent）
        root   /usr/local/nginx/html/OESStudent;
        index  index.html;

        # 单站点访问日志（按需修改路径）
        access_log /var/log/nginx/OESStudent_access.log main;
        error_log  /var/log/nginx/OESStudent_error.log warn;

        # ---------------------------
        # 如果你使用 Nuxt SSR（你当前是 SSR），把前端请求反代到 Node 服务（3000）
        # 我们将 /_nuxt/ /static/ 等资源也代理到 node，以便 SSR 输出的静态资源正确加载
        # 如果你改为静态部署（nuxt generate），可改为直接用 alias/try_files
        # ---------------------------

        # 处理 WebSocket upgrade & 长连接
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 转发前端所有根路径请求到 Nuxt SSR（node:3000）
        # 但为了 API 请求和 admin 等后端接口，我们将 /api/ 的请求优先代理到 gateway（见下）
        location / {
            # 如果你希望前端静态文件直接由 nginx 提供（减少 node 负载），可使用 try_files 优先读取静态文件：
            # try_files $uri $uri/ @nuxt;
            # 目前直接反代至 Node，确保 node 服务启动在 127.0.0.1:3000
            # proxy_pass http://localhost:3000;
            proxy_pass https://m.xydec.com.cn/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # 如果你希望静态资源直接由 nginx 提供而不是由 node 返回（可减少 node IO），
        # 可以启用下面的 location 并注释上面的 / location 中的 proxy_pass（可选）
        #location / {
        #    try_files $uri $uri/ /index.html;
        #}

        # Nuxt 静态构建目录（若 SSR 也会有 _nuxt 静态资源，通常由 node 提供，但如果你把其静态文件复制到 nginx 下可开启此段）
        location /_nuxt/ {
            # 如果 _nuxt 文件放在 /usr/share/nginx/html/OESStudent/_nuxt/
            alias /usr/local/nginx/html/OESStudent/_nuxt/;
            access_log off;
            expires max;
            add_header Cache-Control "public";
        }

        location /static/ {
            alias /usr/local/nginx/html/OESStudent/static/;
            access_log off;
            expires max;
            add_header Cache-Control "public";
        }

        # 如果你有 favicon 或其它静态文件
        location = /favicon.ico {
            access_log off;
            log_not_found off;
            try_files /favicon.ico =204;
        }

        # ---------------------------
        # API 反向代理：所有以 /api/ 开头的请求转发到 gateway（统一网关）
        # 代理时保留 Host、X-Forwarded 等头，支持 WebSocket
        # 若 gateway 对后端路径有要求（如需要去除 /api 前缀），请在 Spring Cloud Gateway 中配置 stripPrefix 或在此处使用 proxy_pass + rewrite
        # ---------------------------
        location ^~ /api/ {
            # 处理 CORS 预检请求（OPTIONS）直接返回 204（可按需保留或删除）
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Length' 0;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                return 204;
            }

            # proxy_pass http://gateway_backend;
            proxy_pass https://m.xydec.com.cn/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_buffering on;

        }

        # 管理或健康检查路径可直接代理到 gateway（或单独设置）
        location /actuator/ {
            proxy_pass http://gateway_backend/actuator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 错误页
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/local/nginx/html;
        }
    } # server end

    server {
        listen 80;
        server_name localhost;
        # root /usr/local/nginx/html/OESStudent/test;
        root /cyberpunk;
        index index.html;

        # 日志（可按需开启或修改路径）
        # access_log /var/log/nginx/oess_student_access.log;
        # error_log  /var/log/nginx/oess_student_error.log warn;

        # 静态资源缓存（扩展名可按需调整）
        location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?|ttf|eot)$ {
            try_files $uri =404;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate";
        }

        # 代理 /api/* 到后端 upstream（保留请求 URI）
        location ^~ /api/ {
            proxy_pass http://gateway_backend;  # 不带尾部斜杠 -> 原始 URI 原封不动转发
            proxy_http_version 1.1;

            # 基本代理头部（推荐）
            # proxy_set_header Host $host;
            # proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # proxy_set_header X-Forwarded-Proto $scheme;
            # proxy_set_header X-Forwarded-Host $host;
            # proxy_set_header X-Forwarded-Port $server_port;

            # 支持 WebSocket 升级（如后端需要）
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # 定义 connection_upgrade 变量（保留或关闭 upgrade）
            # map $http_upgrade $connection_upgrade {
                # default upgrade;
                # ''      close;
            # }

            # 超时配置（根据需要调整）
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            send_timeout 60s;

            # 如果后端期望没有 /api 前缀，请使用下面两行替换上面的 proxy_pass：
            # rewrite ^/api/(.*)$ /$1 break;
            # proxy_pass http://gateway_backend;
        }

        # SPA 路由回退：若请求的文件不存在，返回 index.html（支持前端 HTML5 history）
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 错误页面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            # root /usr/local/nginx/html/OESStudent/test;
            root /usr/local/nginx/html;
            internal;
        }

        # 可选：防止访问隐藏文件（如 .git）
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }
    } # server end

    server {
        listen 50005;
        server_name 539a0cb0.r16.vip.cpolar.cn;
        root /usr/local/nginx/html;
        index index.html index.htm;

        # 访问日志和错误日志
        # access_log /var/log/nginx/xzs_50000_access.log main;
        # error_log  /var/log/nginx/xzs_50000_error.log warn;

        # ========== 为 phone 添加独立 location ==========
        # ---------- 处理 /phone/ 子目录（SPA 回退） ----------
        location ^~ /phone/ {
            alias /usr/local/nginx/html/phone/;   # 映射到实际文件路径
            try_files $uri $uri/ /phone/phone.html;
            access_log off;                         # 可选：关闭访问日志
            expires 7d;                              # 缓存7天
            add_header Cache-Control "public, max-age=604800, must-revalidate";
        }

        # ---------- 处理根目录的静态资源和 SPA 回退 ----------
        location / {
            try_files $uri $uri/ /index.html;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate";
        }

        # 静态资源缓存（用于根目录或其他路径下的静态文件）
        location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|webp|woff2?|ttf|eot)$ {
            try_files $uri =404;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate";
        }

        # 代理所有 /api/* 请求到后端
        location ^~ /api/ {
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;

            # 代理头部
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket 支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 超时配置
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            send_timeout 60s;

            # 如果需要去掉 /api 前缀，取消下面两行注释并注释掉上面的 proxy_pass
            # rewrite ^/api/(.*)$ /$1 break;
            # proxy_pass http://xzs_backend;
        }

        # 如果需要代理所有请求（非静态资源）到后端，可以添加：
        # location / {
        #     try_files $uri $uri/ @backend;
        # }
        # 
        # location @backend {
        #     proxy_pass http://xzs_backend;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # 错误页面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/local/nginx/html;
            internal;
        }

        # 防止访问隐藏文件
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }
    } # server end

    server {
        listen 50001;
        server_name 7446d765.r16.vip.cpolar.cn;
        # root /usr/local/nginx/html/student;
        index index.html index.htm;

        # 访问日志和错误日志
        # access_log /var/log/nginx/xzs_50000_access.log main;
        error_log  /var/log/nginx/xzs_50000_error.log warn;

        # SPA 路由回退
        location / {
            root /usr/local/nginx/html/student/;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 代理所有 /api/* 请求到后端 8170
        location ^~ /api/ {
            # rewrite ^/api/(.*)$ /$1 break;          # 去掉第一个 /api
            # proxy_pass http://98730b7.r16.vip.cpolar.cn;
            proxy_pass http://47.242.112.53;   # 后端服务器 IP
            proxy_http_version 1.1;

            # 代理头部
            proxy_set_header Host 4b08fa3e.r16.vip.cpolar.cn;   # 关键：设置正确的 Host
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket 支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 超时配置
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            send_timeout 60s;

            access_log /var/log/nginx/api_proxy.log;  # 添加调试日志（可选）

            # 如果需要去掉 /api 前缀，取消下面两行注释并注释掉上面的 proxy_pass
            # rewrite ^/api/(.*)$ /$1 break;
            # proxy_pass http://xzs_backend;

        }

        # 错误页面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
